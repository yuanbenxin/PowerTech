<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="神经冲动传导教学图">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14Z" fill="#facc15"/>
    </marker>
    <style>
      .title{font:900 44px "Microsoft YaHei",Arial,sans-serif;fill:#fff}
      .sub{font:700 22px "Microsoft YaHei",Arial,sans-serif;fill:#b8c6d8}
      .label{font:900 24px "Microsoft YaHei",Arial,sans-serif;fill:#fff}
      .small{font:700 18px "Microsoft YaHei",Arial,sans-serif;fill:#cbd5e1}
      .step{font:900 20px "Microsoft YaHei",Arial,sans-serif;fill:#fef3c7}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="96" y="96" class="title">神经冲动传导</text>
  <text x="98" y="134" class="sub">兴奋沿神经元单向传导，到突触处转化为化学信号再传给下一个神经元</text>
  <g transform="translate(110 410)">
    <path d="M80 0H1320" stroke="#0ea5e9" stroke-width="22" stroke-linecap="round"/>
    <g fill="#f8fafc" stroke="#38bdf8" stroke-width="6">
      <rect x="260" y="-44" width="92" height="88" rx="24"/>
      <rect x="430" y="-44" width="92" height="88" rx="24"/>
      <rect x="600" y="-44" width="92" height="88" rx="24"/>
      <rect x="770" y="-44" width="92" height="88" rx="24"/>
    </g>
    <circle cx="90" cy="0" r="62" fill="#fb7185" stroke="#fecdd3" stroke-width="8"/>
    <path d="M1320 0c74-78 128-86 188-90M1320 0c72 8 126 42 188 100" fill="none" stroke="#a78bfa" stroke-width="20" stroke-linecap="round"/>
    <line x1="135" y1="-132" x2="1210" y2="-132" stroke="#facc15" stroke-width="10" marker-end="url(#arrow)"/>
    <circle cx="280" cy="-132" r="20" fill="#facc15"/>
    <circle cx="580" cy="-132" r="20" fill="#facc15"/>
    <circle cx="880" cy="-132" r="20" fill="#facc15"/>
    <text x="150" y="-175" class="step">树突接收</text>
    <text x="470" y="-175" class="step">轴突传导</text>
    <text x="835" y="-175" class="step">髓鞘加速</text>
    <text x="1110" y="-175" class="step">突触传递</text>
  </g>
  <g transform="translate(120 640)">
    <rect width="410" height="142" rx="24" fill="#071826" stroke="#facc15" stroke-opacity=".45"/>
    <text x="30" y="54" class="label">方向性</text>
    <text x="30" y="96" class="small">一般从树突、细胞体，经轴突传向神经末梢。</text>
  </g>
  <g transform="translate(595 640)">
    <rect width="410" height="142" rx="24" fill="#071826" stroke="#38bdf8" stroke-opacity=".45"/>
    <text x="30" y="54" class="label">跳跃式传导</text>
    <text x="30" y="96" class="small">有髓鞘的神经纤维中，兴奋在节点间快速跳跃。</text>
  </g>
  <g transform="translate(1070 640)">
    <rect width="410" height="142" rx="24" fill="#071826" stroke="#a78bfa" stroke-opacity=".45"/>
    <text x="30" y="54" class="label">突触</text>
    <text x="30" y="96" class="small">神经递质跨过突触间隙，把信息传给下一个细胞。</text>
  </g>
</svg>
