            background-attachment: fixed;
            animation: bgScroll 80s linear infinite;
        }

            100% { background-position: 60px 100px; }
        }

        .ambient-glow {

        .cyber-border {
            position: relative;
        }
        
        .cyber-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(var(--chem-accent), 0.4), rgba(var(--chem-accent), 0.05) 40%, rgba(var(--chem-accent-warm), 0.15) 100%);

            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        .card-hover:hover .cyber-border::before {
            background: linear-gradient(145deg, rgba(var(--chem-accent), 0.8), rgba(var(--chem-accent), 0.2) 40%, rgba(var(--chem-accent-warm), 0.4) 100%);
        }

        .text-glow {

        /* Reveal Animation */

            transform: translateY(20px);

        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
