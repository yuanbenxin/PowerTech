<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PowerTech在线教学演示 - 语文诗画可视化系统</title>
    <link rel="stylesheet" href="assets/vendor/fonts/math-local-fonts.css?v=3d76f36c344d">
    <script src="assets/vendor/js/tailwind.min.js?v=a2c3d9b38e8e"></script>
    <script src="assets/vendor/js/lucide.min.js?v=0cb3d1d6855b"></script>
    <style>
        :root {
            /* Chinese Traditional Ink & Wash Cinnabar theme */
            --chinese-accent: 181, 61, 53; /* #B53D35 朱砂红 */
            --chinese-accent-dark: 155, 51, 43; /* #9B332B 深朱砂 */
            --chinese-cream: 245, 241, 232; /* #F5F1E8 宣纸白 */
            --chinese-gold: 197, 191, 158; /* #C5BF9E 古金 */
            --bg-dark: 14, 16, 16; /* 深灰墨 */
        }

        body {
            font-family: 'Kaiti', 'STKaiti', '楷体', '华文楷体', 'Noto Sans SC', -apple-system, sans-serif;
            background-color: rgb(var(--bg-dark));
            background-image: radial-gradient(circle at center, #1b2020 0%, #0e1010 100%);
            color: #E3DEC3;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        .ambient-glow {
            background: radial-gradient(circle at 50% 30%, rgba(var(--chinese-accent), 0.08) 0%, transparent 60%);
        }

        /* SVG 金石印章斑驳效果 */
        .cn-seal-effect {
            filter: url(#seal-distress);
        }

        .cyber-border {
            position: relative;
        }
        
        .cyber-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(145deg, rgba(var(--chinese-accent), 0.4), rgba(var(--chinese-accent), 0.05) 40%, rgba(var(--chinese-gold), 0.15) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        .card-hover:hover .cyber-border::before {
            background: linear-gradient(145deg, rgba(var(--chinese-accent), 0.8), rgba(var(--chinese-accent), 0.2) 40%, rgba(var(--chinese-gold), 0.4) 100%);
        }

        .text-glow {
            text-shadow: 0 0 24px rgba(var(--chinese-accent), 0.5);
        }

        /* Reveal Animation */
        .reveal-up {
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 767px) and (orientation: portrait) {
            body {
                overflow: hidden;
                padding: 12px 10px 10px !important;
                justify-content: center !important;
            }

            header,
            main > .text-glow,
            body > .absolute.bottom-6,
            body > .absolute.bottom-8 {
                display: none !important;
            }

            main {
                max-width: none !important;
                width: 100% !important;
                padding-left: 6px !important;
                padding-right: 6px !important;
            }

            main > h1 {
                display: block !important;
                margin: 0 0 10px !important;
                font-size: clamp(38px, 11vw, 54px) !important;
                line-height: 0.86 !important;
            }

            main > .mb-14 {
                margin-bottom: 12px !important;
            }

            main > .mb-14 span {
                padding: 6px 12px !important;
                font-size: 8px !important;
                letter-spacing: 0.16em !important;
            }

            main > .reveal-up.w-full {
                display: flex !important;
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 10px !important;
                margin: 0 !important;
            }

            .card-hover {
                width: 100% !important;
                max-width: 360px !important;
                min-width: 0 !important;
                flex: 0 0 auto !important;
                margin-left: auto !important;
                margin-right: auto !important;
                border-radius: 26px !important;
            }

            .card-hover > .absolute {
                display: none !important;
            }

            .card-hover > .relative.flex {
                height: clamp(150px, 22vh, 186px) !important;
                min-height: 0 !important;
                padding: 18px !important;
                border-radius: 26px !important;
            }

            .card-hover [class*="top-10"][class*="right-10"] {
                top: 16px !important;
                right: 16px !important;
                width: 36px !important;
                height: 36px !important;
                border-radius: 12px !important;
            }

            .card-hover [data-lucide] {
                width: 20px !important;
                height: 20px !important;
            }

            .card-hover h2 {
                font-size: 20px !important;
                margin-bottom: 4px !important;
            }

            .card-hover p {
                display: none !important;
            }

            .card-hover span.inline-block {
                margin-bottom: 8px !important;
                padding: 4px 8px !important;
                font-size: 8px !important;
                letter-spacing: 0.12em !important;
            }
        }
    </style>
    <link rel="stylesheet" href="./shg-subject-auth-gate.css?v=2111788607f8">

    <!-- SVG 滤镜：模拟印章金石粗糙斑驳感 -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" width="0" height="0">
        <defs>
            <filter id="seal-distress" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- Background Landscape ( fated ink landscape background ) -->
    <div id="media-bg-container" class="fixed inset-0 w-full h-full mix-blend-screen opacity-[0.14] pointer-events-none z-0">

        <span class="font-bold tracking-[0.35em] text-[15px] text-[#E3DEC3] uppercase">PowerTech在线教学演示</span>
    </header>

    <!-- Main Content Center -->
    <main class="z-20 flex flex-col items-center text-center max-w-6xl px-6 relative w-full">

        <div class="hidden md:block text-[#C5BF9E] font-bold tracking-[0.45em] text-sm md:text-[15px] translate-x-[0.2em] mb-4 text-glow reveal-up" style="animation-delay: 0.2s;">
            PowerTech在线教学演示

        <!-- Big Title -->

        <!-- Tagline Pill -->
        <div class="mb-14 reveal-up" style="animation-delay: 0.4s;">

                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-red-500/5 to-transparent -translate-x-full animate-[shimmer_2s_infinite]"></div>

                    <!-- Inner Background Image Parallax -->
                    <div class="absolute inset-0 bg-cover bg-center opacity-[0.35] group-hover:opacity-[0.5] group-hover:brightness-110 transition-all duration-700 transform group-hover:scale-105 group-active:scale-110 mix-blend-screen" style="background-image: url('assets/media/grades/grade_7.jpg');"></div>

                    <div class="cn-seal-effect absolute top-10 right-10 w-14 h-14 rounded-[4px] border-2 border-[#9B332B] bg-[#9B332B]/10 flex items-center justify-center text-[#B53D35] group-hover:scale-110 group-active:scale-95 group-hover:bg-[#9B332B]/20 group-hover:text-white transition-all duration-500 backdrop-blur-md">

                    <!-- Inner Background Image (darker, disabled style) -->
                    <div class="absolute inset-0 bg-cover bg-center opacity-[0.15] filter grayscale brightness-50 mix-blend-screen" style="background-image: url('assets/media/grades/grade_9.jpg');"></div>
                    <div class="absolute inset-0 bg-gradient-to-t from-[#0e1010] via-[#0e1010]/40 to-transparent"></div>
                    
                    <!-- Seal Stamp "敬请期待" in center/top-right -->

                        <span class="text-xs font-bold tracking-widest" style="writing-mode: vertical-rl;">敬请期待</span>
                    </div>

                    <div class="relative z-10 opacity-40">
                        <span class="cn-seal-effect inline-block px-4.5 py-1.5 mb-5 text-[10px] font-bold uppercase tracking-[0.2em] text-zinc-400 bg-zinc-800 border-2 border-zinc-700 rounded-[2px]">
                            高中阶段
                        </span>
                        
                        <h2 class="text-3xl font-bold tracking-tight text-zinc-400 mb-3">
                            高中语文古诗文
                        </h2>
                        
                        <p class="text-xs text-zinc-500 mb-8 max-w-[310px] leading-relaxed">

    <!-- Footer Copyright -->
