        :root {
            /* Math Theme: Platinum & Obsidian (Pure Logic / Matrix feel) */
            --math-accent: 248, 250, 252; /* slate-50 #f8fafc */
            --math-accent-secondary: 148, 163, 184; /* slate-400 #94a3b8 */
            --math-accent-warm: 203, 213, 225; /* slate-300 #cbd5e1 */
            --bg-dark: 5, 8, 12; /* deep dark obsidian base */
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: rgb(var(--bg-dark));
            background-image: radial-gradient(circle at center, #0a1a14 0%, #050a08 100%);
            color: white;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        .ambient-glow {
            background: radial-gradient(circle at 50% 30%, rgba(var(--math-accent), 0.12) 0%, transparent 60%);
        }

        .cyber-border {
            position: relative;
        }
        
        .cyber-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(var(--math-accent), 0.4), rgba(var(--math-accent), 0.05) 40%, rgba(var(--math-accent-warm), 0.15) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        .card-hover:hover .cyber-border::before {
            background: linear-gradient(145deg, rgba(var(--math-accent), 0.8), rgba(var(--math-accent), 0.2) 40%, rgba(var(--math-accent-warm), 0.4) 100%);
        }

        .text-glow {
            text-shadow: 0 0 24px rgba(var(--math-accent), 0.6);
        }

        /* Reveal Animation */
        .reveal-up {
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 767px) and (orientation: portrait) {
            body {
                overflow: hidden;
                padding: 12px 10px 10px !important;
                justify-content: center !important;
            }

            header,
            main > .text-glow,
            body > .absolute.bottom-6,
            body > .absolute.bottom-8 {
                display: none !important;
            }

            main {
                max-width: none !important;
                width: 100% !important;
                padding-left: 6px !important;
                padding-right: 6px !important;
            }

            main > h1 {
                display: block !important;
                margin: 0 0 10px !important;
                font-size: clamp(38px, 11vw, 54px) !important;
                line-height: 0.86 !important;
            }

            main > .mb-14 {
                margin-bottom: 12px !important;
            }

            main > .mb-14 span {

                font-size: 8px !important;
                letter-spacing: 0.16em !important;
            }

            main > .reveal-up.w-full {

                flex-direction: column !important;

                gap: 10px !important;
                margin: 0 !important;
            }

                margin-right: auto !important;
                border-radius: 26px !important;

            .card-hover > .absolute {

                padding: 18px !important;

    </style>
