    <style>
        :root {
            /* Golden Earth / Desert Theme */
            --geo-accent: 234, 179, 8; /* yellow-500 #eab308 */
            --geo-accent-secondary: 245, 158, 11; /* amber-500 #f59e0b */
            --geo-accent-warm: 217, 119, 6; /* amber-600 #d97706 */
            --bg-dark: 15, 14, 10; /* a slight dark warm tint */
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: rgb(var(--bg-dark));
            background-image: radial-gradient(circle at center, #181510 0%, #0d0c08 100%);
            color: white;
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior: none;
        }

        .ambient-glow {
            background: radial-gradient(circle at 50% 30%, rgba(var(--geo-accent), 0.12) 0%, transparent 60%);
        }

        .cyber-border {
            position: relative;
        }
        
        .cyber-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(var(--geo-accent), 0.4), rgba(var(--geo-accent), 0.05) 40%, rgba(var(--geo-accent-warm), 0.15) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        .card-hover:hover .cyber-border::before {
            background: linear-gradient(145deg, rgba(var(--geo-accent), 0.8), rgba(var(--geo-accent), 0.2) 40%, rgba(var(--geo-accent-warm), 0.4) 100%);
        }

        .text-glow {
            text-shadow: 0 0 24px rgba(var(--geo-accent), 0.6);
        }

        /* Reveal Animation */
        .reveal-up {
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
