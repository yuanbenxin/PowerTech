<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerTech 在线教学演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #0c0f12;
    color: #e8eaec;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .bg-deco {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 70% -10%, rgba(52, 211, 153, 0.08), transparent),
      radial-gradient(ellipse 50% 35% at 15% 110%, rgba(96, 165, 250, 0.06), transparent),
      linear-gradient(rgba(10, 12, 15, 0.5), rgba(10, 12, 15, 0.74)),
      url('/background.webp') center / cover no-repeat;
  }
  /* 浅色模式：body 整体反色滤镜，此处二次反转抵消，背景保持原色，改用白色遮罩 */
  html.shg-light .bg-deco {
    filter: invert(1) hue-rotate(180deg);
    background:
      radial-gradient(ellipse 60% 40% at 70% -10%, rgba(255, 255, 255, 0.10), transparent),
      radial-gradient(ellipse 50% 35% at 15% 110%, rgba(255, 255, 255, 0.06), transparent),
      linear-gradient(rgba(245, 246, 250, 0.45), rgba(245, 246, 250, 0.7)),
      url('/background.webp') center / cover no-repeat;
  }
  header {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(20px, 5vw, 56px); height: 64px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(12,15,18,0.35);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid rgba(110,231,183,0.5);
    background: rgba(110,231,183,0.1);
    display: flex; align-items: center; justify-content: center;
    color: #6ee7b7; font-weight: 900; font-size: 15px;
  }
  .brand .name { font-size: 15.5px; font-weight: 800; letter-spacing: 0.04em; }
  .brand .sub { font-size: 11px; color: rgba(232,234,236,0.45); margin-top: 1px; }
  header .tools { display: flex; align-items: center; }

  main {
    position: relative; z-index: 1; flex: 1;
    max-width: 1060px; width: 100%; margin: 0 auto;
    padding: clamp(28px, 6vh, 64px) clamp(20px, 5vw, 56px) 72px;
  }
  .hero { margin-bottom: clamp(24px, 4vh, 40px); }
  .hero h1 {
    font-size: clamp(26px, 4.2vw, 40px); font-weight: 900;
    letter-spacing: 0.01em; line-height: 1.2;
  }
  .hero h1 em { font-style: normal; color: #6ee7b7; }
  .hero p {
    margin-top: 12px; font-size: 14px; line-height: 1.8;
    color: rgba(232,234,236,0.6); max-width: 560px;
  }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .card {
    position: relative; padding: 22px 22px 18px;
    border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.045);
    -webkit-backdrop-filter: blur(5px) saturate(1.2);
    backdrop-filter: blur(5px) saturate(1.2);
    box-shadow: 0 12px 34px -16px rgba(0,0,0,.45);
    transition: transform .2s ease, border-color .2s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(110,231,183,0.35); }
  .card .icon {
    width: 40px; height: 40px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .card .icon svg { width: 20px; height: 20px; }
  .card h3 { font-size: 16.5px; font-weight: 800; }
  .card .desc {
    margin-top: 7px; font-size: 12.5px; line-height: 1.7;
    color: rgba(232,234,236,0.55); min-height: 42px;
  }
  .card .meta {
    margin-top: 12px; font-size: 11px; color: rgba(232,234,236,0.38);
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .card .go {
    margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap;
  }
  .card .go a {
    padding: 8px 16px; border-radius: 9px; font-size: 12.5px; font-weight: 800;
    text-decoration: none; transition: all .18s ease;
    border: 1px solid rgba(255,255,255,0.14); color: rgba(232,234,236,0.8);
    background: rgba(255,255,255,0.04);
  }
  .card .go a:hover { border-color: rgba(110,231,183,0.5); color: #6ee7b7; }
  .card .go a.primary {
    background: #34d399; border-color: #34d399; color: #07130d;
  }
  .card .go a.primary:hover { background: #6ee7b7; }
  .card .title-row { display: flex; align-items: center; gap: 8px; }
  .card .badge {
    padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 800;
    color: #fbbf24; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35);
    white-space: nowrap;
  }
  .card.disabled { opacity: 0.55; }
  .card.disabled:hover { transform: none; border-color: rgba(255,255,255,0.08); }
  .card .go .soon {
    padding: 8px 16px; border-radius: 9px; font-size: 12.5px; font-weight: 800;
    border: 1px dashed rgba(255,255,255,0.2); color: rgba(232,234,236,0.42);
    background: rgba(255,255,255,0.03); cursor: not-allowed; user-select: none;
  }
  footer {
    position: relative; z-index: 1;
    padding: 18px clamp(20px, 5vw, 56px);
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(12,15,18,0.35);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    font-size: 11.5px; color: rgba(232,234,236,0.35);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  footer a { color: rgba(110,231,183,0.7); text-decoration: none; }
  footer a:hover { color: #6ee7b7; }
</style>
</head>
<body>
<div class="bg-deco"></div>
<header>
  <a class="brand" href="/" title="返回主页">
    <div class="logo">P</div>
    <div>
      <div class="name">PowerTech 在线教学演示</div>
      <div class="sub">六学科交互课件</div>
    </div>
  </a>
  <div class="tools"></div>
</header>

<main>
  <div class="hero">
    <h1>选择学科，<em>开始演示</em></h1>
    <p>覆盖语文、数学、英语、物理、化学、生物六个学科的交互式教学演示与可视化实验。</p>
  </div>

  <div class="grid" id="cards"></div>
</main>

<footer>
  <span>©2026-现在 本新同学 All right reserved</span>
  <span>
    <a href="https://yuanbenxin.github.io/myblog/" target="_blank" rel="noopener">关于作者</a>
    &nbsp;·&nbsp;
    <a href="/disclaimer.html" target="_blank" rel="noopener">重要声明</a>
  </span>
</footer>

<script>
var SUBJECTS = [
  { key: 'chinese', name: '语文', color: '#f472b6', badge: '欠完善',
    desc: '初中诗词文言文卡片、名著导读与背诵默写训练，部分课件仍在搭建中。',
    stages: ['junior'] },
  { key: 'math', name: '数学', color: '#60a5fa', badge: '欠完善',
    desc: '初高中数学可视化演示：函数图象、几何变换、圆锥曲线等动态课件与题库练习，部分课件仍在搭建中。',
    stages: ['senior', 'junior'] },
  { key: 'english', name: '英语', color: '#38bdf8', disabled: true,
    desc: '英语学科演示课件正在开发中，敬请期待。',
    stages: [] },
  { key: 'physics', name: '物理', color: '#fbbf24', disabled: true,
    desc: '物理学科演示课件正在开发中，敬请期待。',
    stages: [] },
  { key: 'chemistry', name: '化学', color: '#a78bfa',
    desc: '元素视界实验室：周期表图谱、分子结构搭建、反应原理模拟等 10+ 个演示。',
    stages: [] },
  { key: 'biology', name: '生物', color: '#34d399',
    desc: '细胞结构与代谢、遗传与进化、稳态与调节等 73 个交互模块，含 3D 模型与模拟器。',
    stages: ['senior', 'junior'] }
];
var STAGE_LABEL = { senior: '高中', junior: '初中' };
var ICONS = {
  biology: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>',
  math: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 8h3M8 12h8M8 16h8M16 8h.01"/></svg>',
  english: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
  physics: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5"/><path d="M20.2 20.2c-3.2-7.1-9.6-13.4-16.4-16.4"/><path d="M3.8 3.8c3.2 7.1 9.6 13.4 16.4 16.4"/><path d="M20.2 3.8c-3.2 7.1-9.6 13.4-16.4 16.4"/><path d="M3.8 20.2c3.2-7.1 9.6-13.4 16.4-16.4"/></svg>',
  chinese: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  chemistry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7 15h10"/></svg>'
};

function render() {
  var box = document.getElementById('cards');
  var html = '';
  for (var i = 0; i < SUBJECTS.length; i++) {
    var s = SUBJECTS[i];
    var meta = s.disabled
      ? ''
      : '交互课件' + (s.stages.length > 1 ? ' · 初高中双学段' : (s.stages.length === 1 ? ' · ' + STAGE_LABEL[s.stages[0]] : ''));
    html += '<div class="card' + (s.disabled ? ' disabled' : '') + '">' +
      '<div class="icon" style="color:' + s.color + ';background:' + s.color + '1a;border:1px solid ' + s.color + '40">' + ICONS[s.key] + '</div>' +
      '<div class="title-row"><h3>' + s.name + '</h3>' + (s.badge ? '<span class="badge">' + s.badge + '</span>' : '') + '</div>' +
      '<div class="desc">' + s.desc + '</div>' +
      (meta ? '<div class="meta">' + meta + '</div>' : '') +
      '<div class="go">';
    if (s.disabled) {
      html += '<button class="soon" disabled>暂 未 开 发</button>';
    } else if (s.stages.length === 0) {
      html += '<a class="primary" href="/subjects/' + s.key + '/app.html">进 入 演 示</a>';
    } else {
      for (var j = 0; j < s.stages.length; j++) {
        var st = s.stages[j];
        html += '<a href="/subjects/' + s.key + '/app.html?stage=' + st + '">' + STAGE_LABEL[st] + '</a>';
      }
    }
    html += '</div></div>';
  }
  box.innerHTML = html;
}

render();
</script>
<script src="/powertech-ui.js"></script>
</body>
</html>
